<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>ランキング | RE:CREATION</title>

<body class="page-ranking bg-uroko-cyan">
  <!-- 3Dアリーナ全画面背景Canvas（案C: 左右立体スタンド＆トラス梁・中央完全クリーン） -->
<div id="container">
    <site-header></site-header>
    <!-- Breadcrumb -->
    <div class="breadcrumb">
      <a href="index.html"><i data-lucide="home" style="width: 14px; height: 14px;"></i> トップ</a>
      <span class="sep">/</span>
      <span class="current">ランキング</span>
    </div>
    <!-- Main Content -->
    <main class="main ranking-main">
      <!-- タイトル -->
      <div class="ranking-title ">
        <div class="page-symbol-badge">
          <div class="symbol-pod">
            <img src="images/crown_white.png" alt="" class="symbol-img">
          </div>
        </div>
        <h2>ランキング</h2>
      </div>
      <!-- ステータスバナー（準備中） -->
      <div class="cs-placeholder-card" style="margin-bottom: 2.2rem;">
        <div class="cs-icon-pod">
          <i data-lucide="trophy"></i>

        <span class="cs-badge">STATUS: COMING SOON</span>
      </div>
      <!-- 導入文 -->
      <div class="ranking-kousin">
        <h4 class="ranking-kousin-text">
          順位速報（大会開始後にリアルタイム更新）
        </h4>
      </div>
      <!-- ランキングテーブル -->
      <div class="ranking-table-card">
        <table class="tableR">
          <tbody id="ranking-body"></tbody>
        </table>
      </div>

    </main>

    <site-footer></site-footer>

  </div> <!--container-->
